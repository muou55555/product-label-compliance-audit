# 配料名称修饰词 / 声称词库（ingredient name modifiers）
#
# 用途：配料名称合规性检查（与"完整性"并列）。
#   对每个配料名做：1) 修饰词/声称词扫描；2) 去掉修饰词后归一化到标准名称。
# 命中修饰词不等于一律违法，但都属于"非标准名称成分"，须按 risk 处理：
#   absolute  绝对化/易误导 → 建议删除（天然、纯、上等、极品…）
#   grade     等级词 → 仅当执行标准规定该等级时可标示
#   cert      认证类 → 须有有效证书（有机、绿色…）
#   zero      零添加/不添加 → 现行监管严格限制，须举证
#   verify    需举证 → 须有客观依据（手工、古法、野生…）
#
# 检测顺序：先按 whitelist 整体豁免标准名称，再扫描修饰词，避免误报。

version: 1

modifiers:
  absolute:
    color: red
    label: 绝对化/易误导修饰
    note: 标准名称中无此修饰，易使消费者误解，建议删除
    words: [纯天然, 天然, 纯正, 纯, 100%, 百分百, 上等, 优质, 极品, 顶级,
            精选, 精制, 精品, 高级, 特优, 一流, 正宗]
  grade:
    color: blue
    label: 等级词（需为法定分级）
    note: 仅当产品执行标准明确规定该等级时可标示，否则不得标示
    words: [特级, 优级, 一级, 二级]
  cert:
    color: blue
    label: 认证类修饰
    note: 须取得相应有效认证证书后方可标示
    words: [有机, 绿色, 无公害, 有机转换]
  zero:
    color: amber
    label: 零添加/不添加
    note: 现行监管对该类声称严格限制，须真实且可举证
    words: [无添加, 零添加, 不添加, 未添加, 不含, 绝不含, 绝不添加,
            无防腐剂, 无人工色素, 无色素]
  verify:
    color: amber
    label: 需举证修饰
    note: 须有客观、可追溯依据，否则不得标示
    words: [手工, 古法, 传统, 野生, 原生态, 新鲜, 现做, 自制, 家养, 散养,
            深海, 高山, 当季, 原汁, 原浆]

# 白名单：整体豁免，避免把标准名称中的固定用字误判为修饰。
whitelist:
  # 标准名称中本身含“天然”的法定名称
  exact:
    - 天然水
    - 天然矿泉水
  # 描述真实物理属性、并非“零添加声称”的前缀（如 无核葡萄干）
  attribute_prefix:
    - 无核
